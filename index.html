  <style>
    :root {

    .part-card-title{font-weight:1000;font-size:1.1rem;margin-bottom:6px}
    .part-card-note{color:var(--muted);font-weight:700;line-height:1.35}

    .home-actions{grid-template-columns:1fr 1fr}.home-actions .wide{grid-column:1/-1}
    .lesson-section{display:grid;gap:10px}
    .lesson-section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted);font-size:.82rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 2px 0}
    .lesson-section-title span:last-child{letter-spacing:0;text-transform:none;font-size:.78rem;font-weight:800}
    .lesson-card,.prefix-card,.question-card,.match-row,.sentence-card,.classify-card,.summary-card{border:1px solid var(--line);border-radius:18px;background:#fffdf7;padding:14px;display:grid;gap:10px}
    .lesson-card{text-align:left;cursor:pointer;color:var(--ink);font:inherit;box-shadow:0 2px 8px rgba(62,45,21,.05)}
    .lesson-card:hover{border-color:#bda77b;background:#fff8e9}

    .lesson-card.status-in-progress{background:linear-gradient(180deg,rgba(255,248,233,.98),rgba(245,229,198,.98));border-color:rgba(189,151,75,.55)}
    .lesson-card.status-completed{background:linear-gradient(180deg,rgba(244,251,236,.98),rgba(226,241,210,.98));border-color:rgba(107,143,58,.45)}
    .lesson-card.status-in-progress .score-chip{background:#fff1d2;border-color:rgba(189,151,75,.45);color:#7a5a1c}

    .lesson-card-sub{color:var(--muted);font-size:.93rem}
    .lesson-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .lesson-kind{padding:4px 8px;font-size:.68rem;color:#486923;background:rgba(239,247,229,.72);border-color:rgba(107,143,58,.22)}
    .score-chip,.tag{padding:4px 8px;border-radius:999px;background:#f7eedf;border:1px solid var(--line);color:var(--muted);font-size:.78rem;font-weight:850}
    .prefix-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
    .prefix{font-weight:900;font-size:1.2rem;letter-spacing:-.01em}.meaning{font-weight:800;color:var(--accent-2);text-align:right}.examples{color:var(--muted);font-size:.95rem;font-style:italic}
    .filter-row{display:flex;flex-wrap:wrap;gap:8px}.filter-btn{cursor:pointer;text-transform:none;letter-spacing:0;font-size:.85rem;background:#fffdf7}.filter-btn.active{border-color:var(--accent);background:#eff6e2;color:var(--accent-2)}
    .option,.chip,.dropzone,.group-zone,.assigned-chip,.tf-btn,.inline-drop{border:1px solid var(--line);background:#fffdf7;border-radius:16px;padding:14px;min-height:52px;font:inherit;color:var(--ink);text-align:left;overflow-wrap:break-word;word-break:break-word;hyphens:manual}
    button.option,button.chip,button.dropzone,button.group-zone,button.assigned-chip,.tf-btn,.inline-drop{cursor:pointer}
    button.option:hover,button.chip:hover,button.dropzone:hover,button.group-zone:hover,button.assigned-chip:hover,.tf-btn:hover,.inline-drop:hover,.group-zone.drop-hover{border-color:#bda77b;background:#fff8e9}
    .option.selected,.chip.selected,.dropzone.selected,.tf-btn.selected{border-color:var(--accent);background:#eff6e2;box-shadow:var(--focus)}
    .option.correct,.dropzone.correct,.assigned-chip.correct,.tf-btn.correct,.inline-drop.correct{border-color:rgba(78,122,46,.75);background:#eef6e6}
    .option.wrong,.dropzone.wrong,.assigned-chip.wrong,.tf-btn.wrong,.inline-drop.wrong{border-color:rgba(180,75,63,.75);background:#fae8e4}
    .chips{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
    .chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;font-weight:900;background:#f2e5cc;user-select:none}
    .chip.used{opacity:.38;pointer-events:none}.question-title,.match-term{font-weight:850;font-size:1.03rem}
    .question-feedback{display:none;border-radius:14px;padding:11px;font-size:.94rem;font-weight:650}.question-feedback.show.good{display:block;background:#eef6e6;color:#31511d;border:1px solid rgba(78,122,46,.35)}.question-feedback.show.bad{display:block;background:#fae8e4;color:#7a2c24;border:1px solid rgba(180,75,63,.35)}
    .dropzone{display:flex;align-items:center;justify-content:space-between;gap:10px;border-style:dashed;color:var(--muted);width:100%}.dropzone.filled{border-style:solid;color:var(--ink);font-weight:800;background:#fff8e9}
    .wordline{font-size:1.08rem;font-weight:650}.inline-drop{display:inline-grid;place-items:center;vertical-align:middle;min-width:7.5rem;min-height:2.4rem;padding:4px 10px;border:2px dashed #c8b58d;background:#fff8e9;color:var(--muted)}.inline-drop.filled{border-style:solid;border-color:var(--accent);color:var(--ink);font-weight:900}
    .tf-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tf-btn{min-height:62px;text-align:center;font-weight:900}
    .sort-layout{display:grid;gap:13px}.term-bank{border:1px solid var(--line);background:rgba(255,253,247,.8);border-radius:18px;padding:12px;display:grid;gap:10px}
    .group-zone{display:grid;gap:10px;min-height:96px;background:#fffdf7;border-style:dashed;width:100%}.group-title{font-weight:950;color:var(--accent-2);display:flex;justify-content:space-between;gap:10px;align-items:baseline}.assigned-list{display:flex;flex-wrap:wrap;gap:7px;min-height:34px}.assigned-chip{min-height:0;padding:8px 10px;font-size:.92rem;font-weight:850;background:#f7eedf;cursor:pointer}.assigned-chip:not(.correct):not(.wrong):hover{background:#efe0c4}.empty{color:var(--muted);font-size:.93rem;font-style:italic}

    .text-drag-list {
      display: grid;
      gap: 10px;
    }

    .text-drag-sentence {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: #fffdf7;
      font-size: 1.02rem;
      line-height: 1.55;
    }

    .feedback{border-radius:18px;padding:14px;font-weight:650;display:none}.feedback.show{display:block}.feedback.good{background:#eef6e6;color:#31511d;border:1px solid rgba(78,122,46,.35)}.feedback.bad{background:#fae8e4;color:#7a2c24;border:1px solid rgba(180,75,63,.35)}.feedback.neutral{background:#f1e5cf;color:var(--muted);border:1px solid var(--line)}
    .footer{margin-top:auto;display:grid;gap:10px}
    button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.2);box-shadow:none}
    button:disabled:hover{background:inherit}
    .retry-btn.hidden{display:none}
    .primary,.secondary{border-radius:18px;min-height:54px;padding:14px 18px;font-weight:900;font-size:1rem;cursor:pointer}.primary{border:none;background:linear-gradient(180deg,#7ca449,#5f8731);color:white;box-shadow:0 8px 16px rgba(74,109,35,.24)}.secondary{border:1px solid var(--line);background:#fffdf7;color:var(--ink)}
    .small-note{color:var(--muted);font-size:.88rem;text-align:center}.score-ring{width:150px;height:150px;border-radius:50%;margin:8px auto 0;display:grid;place-items:center;background:radial-gradient(circle closest-side,var(--card) 72%,transparent 73% 100%),conic-gradient(var(--accent) var(--score-deg),#e3d5bd 0);border:1px solid var(--line)}.score-number{font-size:2.1rem;font-weight:950;letter-spacing:-.04em}
    .review-grid{display:grid;gap:9px}.review-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:10px 12px;border-radius:15px;background:#f7eedf;border:1px solid var(--line)}
    input.blank-input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fffdf7;color:var(--ink);font:inherit;font-weight:800}
    @media (min-width:560px){.home-actions{grid-template-columns:1fr 1fr}}
    @media (min-width:680px){body{padding-top:28px}.card{padding:28px}}

      min-height:100dvh;

        max(14px, env(safe-area-inset-top))

    button,.option,.chip,.dropzone,.group-zone,.assigned-chip,.tf-btn,.inline-drop,.lesson-card,.part-card{
      -webkit-tap-highlight-color:rgba(107,143,58,.16);

    }
    button,input,select,textarea{
      -webkit-appearance:none;
      appearance:none;
    }
    input,select,textarea,button{
      font-size:16px;
    }
    .primary,.secondary,.icon-btn,.option,.chip,.dropzone,.tf-btn,.inline-drop{
      -webkit-user-select:none;

    @media (max-width:390px){
      body{padding-left:8px;padding-right:8px}

    .filter-select{
      width:100%;

      box-shadow:0 2px 8px rgba(62,45,21,.04);
    }
    .filter-select:focus-visible{
      outline:none;
      box-shadow:var(--focus);
    }

  <script>

    document.addEventListener("touchend", function(e){
      const target = e.target.closest && e.target.closest("button,.option,.chip,.dropzone,.group-zone,.assigned-chip,.tf-btn,.inline-drop,.lesson-card,.part-card");
      if(!target) return;
      const now = Date.now();
      if(target.__lastTouch && now - target.__lastTouch < 320){
        e.preventDefault();
      }
      target.__lastTouch = now;
    }, {passive:false});

    const DATA = {"lessons": [{"id": "1A", "title": "1A — Poloha I", "shortTitle": "Poloha I", "subtitle": "endo-/ento-, ecto-/exo-, para-, peri-", "kind": "Nová látka", "sourceFile": "prefixy_polohy_I_v5.html", "originalTitle": "Prefixy polohy I", "originalKey": "prefixy_polohy_I_v2", "prefixReview": [{"prefix": "endo- / ento-", "meaning": "uvnitř", "examples": "endokard, endomysium, entoderm"}, {"prefix": "ecto- / exo-", "meaning": "vně, zevní", "examples": "ektoderm, exokrinní žlázy"}, {"prefix": "para-", "meaning": "vedle, při, podél", "examples": "paravertebrální, paranazální"}, {"prefix": "peri-", "meaning": "kolem", "examples": "perikard, periost"}], "pages": [{"type": "intro", "title": "Endo- / ento- × ecto- / exo-", "lead": "Nejdřív si všimněte základního protikladu: něco může být uvnitř, nebo naopak vně.", "items": [{"prefix": "endo- / ento-", "meaning": "uvnitř", "examples": "endokard, endomysium, entoderm"}, {"prefix": "ecto- / exo-", "meaning": "vně, zevní", "examples": "ektoderm, exokrinní žlázy"}], "note": "Výkladová strana není bodovaná.", "points": 0}, {"type": "truefalse", "title": "end(o)- = uvnitř", "statement": "end(o)- znamená „uvnitř“.", "answer": true, "points": 1, "good": "Ano. Prefix endo- označuje, že něco je uvnitř nebo ve vnitřní části struktury.", "bad": "Pozor: endo- znamená „uvnitř“ nebo „ve vnitřní části“. Proto se objevuje ve slovech jako endokard nebo endomysium, kde označuje vztah dovnitř určité struktury."}, {"type": "drag", "title": "Endokrinní × exokrinní", "points": 2, "chips": ["endo-", "exo-"], "items": [{"id": "endo", "correct": "endo-", "after": "krinní žlázy", "text": "žlázy s vnitřní sekrecí; nemají vývody a vylučují hormony přímo do krve."}, {"id": "exo", "correct": "exo-", "after": "krinní žlázy", "text": "žlázy s vnější sekrecí; mají vývody a své sekrety, například pot, sliny nebo trávicí enzymy, vypouštějí na povrch těla nebo do tělesných dutin."}], "good": "Správně. Endokrinní žlázy vylučují dovnitř těla, přímo do krve. Exokrinní žlázy vylučují navenek nebo do tělesných dutin prostřednictvím vývodů.", "bad": "Tady rozhoduje protiklad endo- × exo-. Endokrinní znamená „s vnitřní sekrecí“ — sekrece jde dovnitř, do krve. Exokrinní znamená „s vnější sekrecí“ — sekret odchází vývodem na povrch nebo do dutiny."}, {"type": "drag", "title": "Entoderm × ektoderm", "points": 2, "chips": ["ento-", "ekto-"], "items": [{"id": "entoderm", "correct": "ento-", "after": "derm", "text": "je vnitřní zárodečný list; vzniká z něj například epitel trávicí a dýchací trubice."}, {"id": "ektoderm", "correct": "ekto-", "after": "derm", "text": "je zevní zárodečný list; vzniká z něj například pokožka a nervová soustava."}], "good": "Správně. Entoderm je vnitřní zárodečný list, ektoderm je zevní zárodečný list.", "bad": "Pozor na dvojici ento- × ekto-. Ento- patří k významu „uvnitř“, proto entoderm = vnitřní zárodečný list. Ekto- patří k významu „vně, zevní“, proto ektoderm = zevní zárodečný list."}, {"type": "contrast", "title": "Para- × peri-", "lead": "Teď přidáme druhou důležitou dvojici. Para- a peri- se snadno pletou, ale neznamenají totéž.", "points": 0, "items": [{"prefix": "para-", "meaning": "vedle, při, podél", "examples": "paravertebralis, paratrachealis"}, {"prefix": "peri-", "meaning": "kolem", "examples": "pericardium, periosteum"}], "note": "Para- označuje blízkost nebo průběh podél struktury; peri- označuje obklopení nebo obal kolem struktury."}, {"type": "truefalse", "title": "Para- = kolem?", "statement": "Para- znamená „kolem“.", "answer": false, "points": 1, "good": "Správně. Para- znamená spíše „vedle, při, podél“. Význam „kolem“ odpovídá prefixu peri-.", "bad": "Pozor: „kolem“ odpovídá prefixu peri-. Prefix para- znamená spíše „vedle, při, podél“ — tedy v blízkosti určité struktury, ne jako obal kolem ní."}, {"type": "mcq", "title": "Pericardium", "question": "Pericardium je _____", "points": 1, "options": ["nitroblána srdeční", "osrdečník, obal srdce", "srdeční svalovina"], "answer     const screen = document.getElementById("screen");
    const progressBar = document.getElementById("progressBar");
    const topTitle = document.getElementById("topTitle");
    const backBtn = document.getElementById("backBtn");
    const homeBtn = document.getElementById("homeBtn");

    let app = load();

    function load(){
      try {
        return JSON.parse(localStorage.getItem(MASTER_KEY)) || { view:"home", lessonId:null, overviewFilter:"vše", lessons:{} };
      } catch(e) {
        return { view:"home", lessonId:null, overviewFilter:"vše", lessons:{} };
      }
    }
    function save(){ try { localStorage.setItem(MASTER_KEY, JSON.stringify(app)); } catch(e) { /* úložiště nedostupné (anonymní režim, limit atd.) — pokračujeme bez ukládání */ } }
    function esc(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
    function shuffle(arr){ return [...arr].sort(() => Math.random() - .5); }
    function lessonById(id){ return LESSONS.find(l => l.id === id); }
    function lessonPartKey(id){
      const section = LESSON_SECTIONS.find(s => s.ids.includes(id));
      return section ? section.key : "greek";
    }
    function lessonPartName(id){
      const key = lessonPartKey(id);
      return key === "latin" ? "Latinské prefixy" : (key === "test" ? "Příprava na test" : "Řecké prefixy");
    }
    function partViewForLesson(id){
      const key = lessonPartKey(id);
      return key === "latin" ? "latin" : (key === "test" ? "test" : "greek");
    }
    function lessonsForPart(key){
      const ids = LESSON_SECTIONS.filter(s => s.key === key).flatMap(s => s.ids);
      return ids.map(lessonById).filter(Boolean);
    }
    function sectionsForPart(key){
      return LESSON_SECTIONS.filter(s => s.key === key);
    }
    function getLessonState(id){
      if(!app.lessons[id]) app.lessons[id] = { page:0, score:0, best:0, completed:false, pageScores:{}, answers:{} };
      if(!app.lessons[id].pageScores) app.lessons[id].pageScores = {};
      if(!app.lessons[id].answers) app.lessons[id].answers = {};
      return app.lessons[id];
    }
    function totalPoints(lesson){ return lesson.totalPoints || lesson.pages.reduce((s,p)=>s+pagePoints(p),0); }
    function pagePoints(p){
      if(Number.isFinite(p.points)) return p.points;
      if(p.type === "multiMcq" || p.type === "multiTf") return (p.questions || []).length;
      if(p.type === "sort" || p.type === "classify" || p.type === "drag") return (p.items || []).length;
      if(p.type === "matching") return (p.terms || []).length;
      if(["mcq","truefalse","blank"].includes(p.type)) return 1;
      return 0;
    }
    function scorePage(lesson, pageIndex, score){
      const st = getLessonState(lesson.id);
      st.pageScores[pageIndex] = score;
      st.score = Object.values(st.pageScores).reduce((a,b)=>a + Number(b || 0), 0);
      save();
    }
    function progressPercent(){
      if(app.view !== "lesson") return 0;
      const lesson = lessonById(app.lessonId);
      const st = getLessonState(app.lessonId);
      return Math.min(100, Math.round((st.page / Math.max(1, lesson.pages.length - 1)) * 100));
    }
    function renderChrome(cardClass=""){
      const isLesson = app.view === "lesson";
      const lesson = isLesson ? lessonById(app.lessonId) : null;
      let title = "Prefixy v lékařské terminologii";
      let iconKey = null;
      if(isLesson) { title = lesson.shortTitle; iconKey = lessonPartKey(lesson.id); }
      else if(app.view === "greek") { title = "Řecké prefixy"; iconKey = "greek"; }
      else if(app.view === "latin") { title = "Latinské prefixy"; iconKey = "latin"; }
      else if(app.view === "test") { title = "Příprava na test"; iconKey = "test"; }
      else if(app.view === "overview") title = "Přehled prefixů";
      if(iconKey) topTitle.innerHTML = `<span class="title-wrap"><img class="title-icon" alt="" src="${PART_ICONS[iconKey]}"><span>${esc(title)}</span></span>`;
      else topTitle.textContent = title;
      progressBar.style.width = isLesson ? `${progressPercent()}%` : "0%";
      document.querySelector(".topbar").classList.toggle("hidden", app.view === "home");
      backBtn.style.visibility = app.view === "home" ? "hidden" : "visible";
      homeBtn.style.visibility = app.view === "home" ? "hidden" : "visible";
      screen.className = `card ${cardClass}`.trim();
    }
    function setView(view){ app.view = view; save(); render(); }
    function startLesson(id){ app.view = "lesson"; app.lessonId = id; const st = getLessonState(id); if(st.completed) { st.page = lessonById(id).pages.length - 1; } save(); render(); }
    function restartLesson(id){ app.lessons[id] = { page:0, score:0, best:getLessonState(id).best || 0, completed:false, pageScores:{}, answers:{} }; app.view="lesson"; app.lessonId=id; save(); render(); }
    function nextLessonAfter(id){
      const samePart = lessonsForPart(lessonPartKey(id));
      const idx = samePart.findIndex(l => l.id === id);
      return idx >= 0 && idx < samePart.length - 1 ? samePart[idx+1] : null;
    }
    function nextPage(){
      const lesson = lessonById(app.lessonId);
      const st = getLessonState(lesson.id);
      st.page = Math.min(st.page + 1, lesson.pages.length - 1);
      save(); render();
    }

    function disableCheckButton(){
      const btn = document.getElementById("checkBtn");
      if(btn){
        btn.disabled = true;
        btn.setAttribute("aria-disabled", "true");
      }
      const next = document.getElementById("nextBtn");
      if(next){
        next.disabled = false;
        next.removeAttribute("aria-disabled");
      }
    }

    function showFeedback(ok, msg){
      const f = document.getElementById("feedback");
      if(!f) return;
      f.className = `feedback show ${ok ? "good" : "bad"}`;
      f.textContent = msg;
      const checkBtn = document.getElementById("checkBtn");
      const retryBtn = document.getElementById("retryBtn");
      if(!ok && retryBtn && checkBtn && checkBtn.disabled){
        retryBtn.classList.remove("hidden");
      }
    }
    function footerButtons(check=true, allowRetry=true){
      return `<div class="footer">
        ${check ? `<button class="primary" id="checkBtn">Zkontrolovat</button>${allowRetry ? `<button class="secondary retry-btn hidden" id="retryBtn">Zkusit úlohu znovu</button>` : ""}` : ""}
        <button class="${check ? "secondary" : "primary"}" id="nextBtn"${check ? ` disabled aria-disabled="true"` : ""}>Pokračovat</button>
      </div>`;
    }

    function render(){
      if(app.view === "overview") return renderOverview();
      if(app.view === "lesson") return renderLesson();
      if(app.view === "greek") return renderPartHome("greek");
      if(app.view === "latin") return renderPartHome("latin");
      if(app.view === "test") return renderPartHome("test");
      return renderHome();
    }

    function renderHome(){
      renderChrome("");
      const continueLesson =
        LESSONS.find(l => { const st = getLessonState(l.id); return !st.completed && st.page > 0; }) ||
        LESSONS.find(l => !getLessonState(l.id).completed) ||
        LESSONS[0];
      const stc = getLessonState(continueLesson.id);
      const continueText = stc.completed ? "Znovu spustit první lekci" : (stc.page > 0 ? `Pokračovat: ${continueLesson.title} · strana ${stc.page + 1}/${continueLesson.pages.length}` : `Začít: ${continueLesson.title}`);

      function partStatus(key){
        const list = lessonsForPart(key);
        const done = list.filter(l => getLessonState(l.id).completed).length;
        const started = list.filter(l => { const st = getLessonState(l.id); return st.page > 0 && !st.completed; }).length;
        return `${done}/${list.length} dokončeno${started ? ` · ${started} rozpracováno` : ""}`;
      }

      screen.innerHTML = `
        <h1>Prefixy v lékařské terminologii</h1>
        <p class="lead">Vyberte samostatnou část aplikace. Řecké a latinské prefixy jsou oddělené, příprava na test je spojuje v diagnostickém opakování.</p>
        <div class="part-grid">
          <button class="part-card" data-view="greek">
            <div class="part-card-head">
              <img class="part-icon" alt="" src="${PART_ICONS.greek}">
              <div>
                <div class="part-card-title">Řecké prefixy</div>
                <div class="part-card-note">Lekce 1A–7B a souhrnné opakování řeckých prefixů.<br>${esc(partStatus("greek"))}</div>
              </div>
            </div>
          </button>
          <button class="part-card" data-view="latin">
            <div class="part-card-head">
              <img class="part-icon" alt="" src="${PART_ICONS.latin}">
              <div>
                <div class="part-card-title">Latinské prefixy</div>
                <div class="part-card-note">Samostatná latinská část: intra-, extra-, inter-, sub-, supra-, infra-…<br>${esc(partStatus("latin"))}</div>
              </div>
            </div>
          </button>
          <button class="part-card" data-view="test">
            <div class="part-card-head">
              <img class="part-icon" alt="" src="${PART_ICONS.test}">
              <div>
                <div class="part-card-title">Příprava na test</div>
                <div class="part-card-note">Diagnostický test z řeckých i latinských prefixů.<br>${esc(partStatus("test"))}</div>
              </div>
            </div>
          </button>
        </div>
        <div class="home-actions">
          <button class="primary wide" id="continueBtn">${esc(continueText)}</button>
          <button class="secondary" id="overviewBtn">Přehled prefixů</button>
          <button class="secondary" id="resetBtn">Reset pokroku</button>
        </div>`;
      document.getElementById("continueBtn").onclick = () => startLesson(continueLesson.id);
      document.getElementById("overviewBtn").onclick = () => setView("overview");
      document.getElementById("resetBtn").onclick = () => { if(confirm("Smazat uložený pokrok ve všech lekcích?")) { app.lessons = {}; save(); render(); } };
      screen.querySelectorAll("[data-view]").forEach(btn => btn.onclick = () => setView(btn.dataset.view));
    }

    function renderPartHome(key){
      renderChrome("");
      const partName = key === "latin" ? "Latinské prefixy" : (key === "test" ? "Příprava na test" : "Řecké prefixy");
      const sections = sectionsForPart(key);
      const partLessons = lessonsForPart(key);
      const continueLesson =
        partLessons.find(l => { const st = getLessonState(l.id); return !st.completed && st.page > 0; }) ||
        partLessons.find(l => !getLessonState(l.id).completed) ||
        partLessons[0];
      const stc = continueLesson ? getLessonState(continueLesson.id) : null;
      const continueText = !continueLesson ? "Žádná lekce" : (stc.completed ? `Znovu spustit: ${continueLesson.title}` : (stc.page > 0 ? `Pokračovat: ${continueLesson.title} · strana ${stc.page + 1}/${continueLesson.pages.length}` : `Začít: ${continueLesson.title}`));

      function lessonStatus(lesson){
        const st = getLessonState(lesson.id);
        const max = totalPoints(lesson);
        if(st.completed) return { main:"Dokončeno", detail:`nejlepší výsledek ${st.best}/${max}`, className:"status-completed" };
        if(st.page > 0) return { main:"Rozpracováno", detail:`strana ${st.page + 1}/${lesson.pages.length}`, className:"status-in-progress" };
        return { main:"Nezačato", detail:`${lesson.pages.length} stran`, className:"status-not-started" };
      }
      function card(lesson){
        const s = lessonStatus(lesson);
        return `<button class="lesson-card ${esc(s.className)}" data-lesson="${esc(lesson.id)}">
          <div class="lesson-card-top">
            <div><div class="lesson-card-title">${esc(lesson.title)}</div><div class="lesson-card-sub">${esc(lesson.subtitle)}</div></div>
            <span class="lesson-kind">${esc(lesson.kind)}</span>
          </div>

    function renderOverview(){
      renderChrome("");
      const sourceOf = x => String(x.type || "").startsWith("latinské") ? "latinské prefixy" : "řecké prefixy";
      const typeFilters = Array.from(new Set(DATA.prefixOverview.map(x => x.type)));
      const mainFilters = ["vše", "řecké prefixy", "latinské prefixy"];
      const current = app.overviewFilter || "vše";
      const items =
        current === "vše" ? DATA.prefixOverview :
        current === "řecké prefixy" ? DATA.prefixOverview.filter(x => sourceOf(x) === "řecké prefixy") :
        current === "latinské prefixy" ? DATA.prefixOverview.filter(x => sourceOf(x) === "latinské prefixy") :
        DATA.prefixOverview.filter(x => x.type === current);

      function prefixCard(x){
        return `<div class="prefix-card">
          <div class="prefix-line"><span class="prefix">${esc(x.prefix)}</span><span class="meaning">${esc(x.meaning)}</span></div>
          <span class="tag">${esc(x.type)}</span>
          <div class="examples">${esc(x.examples)}</div>
        </div>`;
      }
      function groupedCards(){
        if(current !== "vše") return items.map(prefixCard).join("");
        const greek = items.filter(x => sourceOf(x) === "řecké prefixy");
        const latin = items.filter(x => sourceOf(x) === "latinské prefixy");
        return `<div class="part-title">Řecké prefixy</div>${greek.map(prefixCard).join("")}<div class="part-title">Latinské prefixy</div>${latin.map(prefixCard).join("")}`;
      }

      screen.innerHTML = `<h1>Přehled prefixů</h1>
        <p class="lead">Rychlý slovníček prefixů pro hotové lekce. Řecké a latinské prefixy lze zobrazit odděleně.</p>
        <div class="filter-row">${mainFilters.map(f => `<button class="filter-btn ${f===current?"active":""}" data-filter="${esc(f)}">${esc(f)}</button>`).join("")}</div>
        <select class="filter-select" id="overviewTypeFilter" aria-label="Tematické členění prefixů">
          <option value="">Tematické členění…</option>
          ${typeFilters.map(f => `<option value="${esc(f)}" ${f===current?"selected":""}>${esc(f)}</option>`).join("")}
        </select>
        <div class="prefix-list">${groupedCards()}</div>
        <div class="footer"><button class="secondary" id="homeFromOverview">Zpět na rozcestník</button></div>`;
      screen.querySelectorAll("[data-filter]").forEach(btn => btn.onclick = () => { app.overviewFilter = btn.dataset.filter; save(); renderOverview(); });
      document.getElementById("overviewTypeFilter").onchange = e => {
        if(e.target.value){
          app.overviewFilter = e.target.value;
          save();
          renderOverview();
        }
      };
      document.getElementById("homeFromOverview").onclick = () => setView("home");
    }

    function renderLesson(){
      const lesson = lessonById(app.lessonId);
      const st = getLessonState(lesson.id);
      const page = lesson.pages[st.page] || lesson.pages[0];
      if(page.type === "final") return renderFinal(lesson, page);
      const learn = ["intro","contrast"].includes(page.type);
      renderChrome(learn ? "learn" : "exercise");
      if(!learn && st.pageScores[st.page] !== undefined){
        return renderReviewedPage(lesson, page, st.pageScores[st.page]);
      }
      if(page.type === "intro" || page.type === "contrast") return renderIntro(lesson, page);
      if(page.type === "truefalse") return renderTrueFalse(lesson, page);
      if(page.type === "mcq") return renderMcq(lesson, page);
      if(page.type === "blank") return renderBlank(lesson, page);
      if(page.type === "multiMcq") return renderMultiMcq(lesson, page);
      if(page.type === "multiTf") return renderMultiTf(lesson, page);
      if(page.type === "matching") return renderMatching(lesson, page);
      if(page.type === "drag") return renderDrag(lesson, page);
      if(page.type === "textDrag") return renderTextDrag(lesson, page);
      if(page.type === "sort" || page.type === "classify") return renderSort(lesson, page);
      return renderIntro(lesson, page);
    }

    function renderReviewedPage(lesson, page, score){
      const max = pagePoints(page);
      const ok = score >= max;
      screen.innerHTML = `<div class="mode-badge">Cvičení</div><h2>${esc(page.title)}</h2>
        <div class="summary-card"><p>Tuto stránku jste už vyplnili: ${score}/${max} bodů.</p></div>
        <div class="feedback show ${ok ? "good" : "bad"}">${esc(ok ? (page.good || "Správně.") : (page.bad || "Některé odpovědi nebyly správně. Pokud chcete stránku vypracovat znovu, použijte Zpět a Zkusit úlohu znovu."))}</div>
        ${footerButtons(false)}`;
      document.getElementById("nextBtn").onclick = nextPage;
    }

    function renderIntro(lesson, page){

    function renderTrueFalse(lesson, page){

    function renderMcq(lesson, page){

    function renderBlank(lesson, page){

    function renderMultiMcq(lesson, page){
      const answers = {};
      let checked = false;
      const questions = page.questions || [];
      const optionLists = questions.map(q => shuffle((q.options || []).map((text, index) => ({ text, index }))));
      function prompt(q){ return q.q || q.prompt || ""; }
      screen.innerHTML = `<div class="mode-badge">Cvičení</div><h2>${esc(page.title)}</h2>${page.lead ? `<p class="lead">${esc(page.lead)}</p>` : ""}<div class="question-list">${questions.map((q,qi)=>`<div class="question-card" data-q="${qi}"><div class="question-title">${esc(prompt(q))}</div><div class="options">${optionLists[qi].map(o=>`<button class="option" data-q="${qi}" data-i="${o.index}">${esc(o.text)}</button>`).join("")}</div><div class="question-feedback" id="qfb${qi}"></div></div>`).join("")}</div><div class="feedback" id="feedback"></div>${footerButtons()}`;
      screen.querySelectorAll(".option").forEach(b => b.onclick = () => { if(checked) return; const qi = Number(b.dataset.q); answers[qi] = Number(b.dataset.i); screen.querySelectorAll(`.option[data-q="${qi}"]`).forEach(x => x.classList.toggle("selected", x === b)); });
      document.getElementById("checkBtn").onclick = () => {
        if(questions.some((q,qi) => answers[qi] === undefined)) return showFeedback(false, "Nejprve odpovězte na všechny otázky.");
        checked = true;
        let score = 0;
        questions.forEach((q,qi)=>{
          const ans = answers[qi], ok = ans === q.answer;
          if(ok) score++;
          screen.querySelectorAll(`.option[data-q="${qi}"]`).forEach((b)=>{ const i=Number(b.dataset.i); b.classList.toggle("correct", i===q.answer); b.classList.toggle("wrong", i===ans && !ok); });
          const fb = document.getElementById(`qfb${qi}`); fb.className = `question-feedback show ${ok?"good":"bad"}`; fb.textContent = q.explain || (ok ? "Správně." : "Zkuste se vrátit k významu prefixu.");
        });
        const pageIndex = getLessonState(lesson.id).page;
        scorePage(lesson, pageIndex, score);
        if(page.diagnostic){
          const st = getLessonState(lesson.id);
          st.answers[pageIndex] = questions.map((q,qi)=>({ tag:q.tag || "mixed", ok:answers[qi] === q.answer }));
          save();
        }
        disableCheckButton();
        showFeedback(score === questions.length, score === questions.length ? (page.good || "Vše správně.") : (page.bad || `Správně ${score}/${questions.length}.`));
      };
      document.getElementById("nextBtn").onclick = nextPage;
    }

      screen.querySelectorAll(".tf-btn").forEach(b => b.onclick = () => { if(checked) return; const qi=Number(b.dataset.q); answers[qi] = b.dataset.val === "true"; screen.querySelectorAll(`.tf-btn[data-q="${qi}"]`).forEach(x => x.classList.toggle("selected", x===b)); });
      document.getElementById("checkBtn").onclick = () => {

    function renderMatching(lesson, page){
      const terms = page.terms || (lesson.prefixReview || []).map(x => ({term:x.prefix, definition:x.meaning}));
      const definitions = shuffle(terms.map(t => t.definition));
      const assigned = {};
      let selected = null;
      let checked = false;
      screen.innerHTML = `<div class="mode-badge">Cvičení</div><h2>${esc(page.title)}</h2>${page.lead ? `<p class="lead">${esc(page.lead)}</p>` : ""}<div class="term-bank"><div class="chips">${definitions.map(d=>`<button class="chip" data-def="${esc(d)}">${esc(d)}</button>`).join("")}</div></div><div class="question-list">${terms.map((t,i)=>`<div class="match-row"><div class="match-term">${esc(t.term)}</div><button class="dropzone" data-term="${esc(t.term)}">vyberte význam</button></div>`).join("")}</div><div class="feedback" id="feedback"></div>${footerButtons()}`;
      screen.querySelectorAll(".chip").forEach(chip => chip.onclick = () => { if(checked) return; selected = chip.dataset.def; screen.querySelectorAll(".chip").forEach(c=>c.classList.toggle("selected", c===chip)); });
      screen.querySelectorAll(".dropzone").forEach(zone => zone.onclick = () => { if(checked || !selected) return; assigned[zone.dataset.term] = selected; zone.textContent = selected; zone.classList.add("filled"); });
      document.getElementById("checkBtn").onclick = () => {
        if(terms.some(t => !assigned[t.term])) return showFeedback(false, "Nejprve spárujte všechny pojmy.");
        checked = true;
        let score = 0;
        terms.forEach(t => { if(assigned[t.term] === t.definition) score++; });
        scorePage(lesson, getLessonState(lesson.id).page, score);
        disableCheckButton();
        showFeedback(score === terms.length, score === terms.length ? (page.good || "Správně.") : (page.bad || `Správně ${score}/${terms.length}.`));
      };
      document.getElementById("nextBtn").onclick = nextPage;
    }


    function renderTextDrag(lesson, page){
      const assigned = {};
      let selected = null;
      let checked = false;
      const items = shuffle(page.items || []);
      const chips = shuffle(page.chips || []);
      screen.innerHTML = `<div class="mode-badge">Cvičení</div><h2>${esc(page.title)}</h2>${page.lead ? `<p class="lead">${esc(page.lead)}</p>` : ""}
        <div class="term-bank"><div class="chips">${chips.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>
        <div class="text-drag-list">${items.map(item=>`<div class="text-drag-sentence">${esc(item.before || "")}<button class="inline-drop" data-id="${esc(item.id)}">___</button>${esc(item.after || "")}</div>`).join("")}</div>
        <div class="feedback" id="feedback"></div>${footerButtons()}`;
      screen.querySelectorAll(".chip").forEach(chip => chip.onclick = () => {
        if(checked) return;
        selected = chip.dataset.chip;
        screen.querySelectorAll(".chip").forEach(c=>c.classList.toggle("selected", c===chip));
      });
      screen.querySelectorAll(".inline-drop").forEach(drop => drop.onclick = () => {
        if(checked || !selected) return;
        assigned[drop.dataset.id] = selected;
        drop.textContent = selected;

      });
      document.getElementById("checkBtn").onclick = () => {
        if((page.items || []).some(item => !assigned[item.id])) return showFeedback(false, "Nejprve doplňte všechna prázdná místa.");
        checked = true;
        let score = 0;
        (page.items || []).forEach(item => { if(assigned[item.id] === item.correct) score++; });
        screen.querySelectorAll(".inline-drop").forEach(drop => {
          const item = (page.items || []).find(x => x.id === drop.dataset.id);
          const ok = item && assigned[item.id] === item.correct;
          drop.classList.toggle("correct", ok);
          drop.classList.toggle("wrong", !ok);
        });
        scorePage(lesson, getLessonState(lesson.id).page, score);
        disableCheckButton();
        showFeedback(score === (page.items || []).length, score === (page.items || []).length ? (page.good || "Správně.") : (page.bad || `Správně ${score}/${(page.items || []).length}.`));
      };
      document.getElementById("nextBtn").onclick = nextPage;
    }

    function renderDrag(lesson, page){

      const items = shuffle(page.items || []);
      screen.innerHTML = `<div class="mode-badge">Cvičení</div><h2>${esc(page.title)}</h2>${page.lead ? `<p class="lead">${esc(page.lead)}</p>` : ""}<div class="term-bank"><div class="chips">${chips.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div></div><div class="question-list">${items.map(item=>`<div class="sentence-card"><div class="wordline"><button class="inline-drop" data-id="${esc(item.id)}">___</button>${esc(item.after || "")}</div><p>${esc(item.text || "")}</p></div>`).join("")}</div><div class="feedback" id="feedback"></div>${footerButtons()}`;
      screen.querySelectorAll(".chip").forEach(chip => chip.onclick = () => { if(checked) return; selected = chip.dataset.chip; screen.querySelectorAll(".chip").forEach(c=>c.classList.toggle("selected", c===chip)); });
      screen.querySelectorAll(".inline-drop").forEach(drop => drop.onclick = () => { if(checked || !selected) return; assigned[drop.dataset.id] = selected; drop.textContent = selected; drop.classList.add("filled"); });
      document.getElementById("checkBtn").onclick = () => {
        if((page.items||[]).some(item => !assigned[item.id])) return showFeedback(false, "Nejprve doplňte všechna prázdná místa.");
        checked = true;
        let score = 0;
        (page.items||[]).forEach(item => { if(assigned[item.id] === item.correct) score++; });
        scorePage(lesson, getLessonState(lesson.id).page, score);
        disableCheckButton();
        showFeedback(score === (page.items||[]).length, score === (page.items||[]).length ? (page.good || "Správně.") : (page.bad || `Správně ${score}/${(page.items||[]).length}.`));
      };
      document.getElementById("nextBtn").onclick = nextPage;
    }

    function renderSort(lesson, page){
      const items = page.items || [];
      const displayItems = shuffle(items);
      const assigned = {};
      let selected = null;
      let checked = false;
      function name(item){ return item.text || item.term || item.id; }
      function groupLabel(id){
        const g = (page.groups || []).find(x => x.id === id);
        return g ? g.label : id;
      }
      screen.innerHTML = `<div class="mode-badge">Cvičení</div><h2>${esc(page.title)}</h2>${page.lead ? `<p class="lead">${esc(page.lead)}</p>` : ""}<div class="sort-layout"><div class="term-bank"><div class="chips" id="bankChips"></div></div><div class="group-list">${(page.groups||[]).map(g=>`<button class="group-zone" data-group="${esc(g.id)}"><div class="group-title"><span>${esc(g.label)}</span><span></span></div><div class="assigned-list" id="group-${esc(g.id)}"><span class="empty">Sem zařaďte termíny.</span></div></button>`).join("")}</div></div><div class="feedback" id="feedback"></div>${footerButtons()}`;

      function renderBank(){
        const bank = document.getElementById("bankChips");
        const remaining = displayItems.filter(item => !(name(item) in assigned));
        if(selected && !remaining.some(item => name(item) === selected)) selected = null;
        bank.innerHTML = remaining.map(item=>`<button class="chip${name(item)===selected?" selected":""}" data-term="${esc(name(item))}">${esc(name(item))}</button>`).join("");
        bank.querySelectorAll(".chip").forEach(chip => chip.onclick = () => {
          if(checked) return;
          selected = chip.dataset.term;
          bank.querySelectorAll(".chip").forEach(c=>c.classList.toggle("selected", c===chip));
        });
      }
      function redraw(showResult=false){
        (page.groups||[]).forEach(g => {
          const box = document.getElementById(`group-${g.id}`);
          const arr = items.filter(item => assigned[name(item)] === g.id);
          box.innerHTML = arr.length ? arr.map(item => {
            const nm = name(item);
            const ok = assigned[nm] === item.group;
            const cls = showResult ? (ok ? " correct" : " wrong") : "";
            const hint = showResult && !ok ? ` → ${esc(groupLabel(item.group))}` : "";
            return `<span class="assigned-chip${cls}" data-term="${esc(nm)}">${esc(nm)}${hint}</span>`;
          }).join("") : `<span class="empty">Sem zařaďte termíny.</span>`;
          if(!showResult){
            box.querySelectorAll(".assigned-chip").forEach(el => el.onclick = (e) => {
              if(checked) return;
              e.stopPropagation();
              delete assigned[el.dataset.term];
              redraw(false);
            });
          }
        });
        renderBank();
      }
      screen.querySelectorAll(".group-zone").forEach(g => g.onclick = () => {
        if(checked || !selected) return;
        assigned[selected] = g.dataset.group;
        selected = null;
        redraw(false);
      });
      redraw(false);
      document.getElementById("checkBtn").onclick = () => {
        if(items.some(item => !assigned[name(item)])) return showFeedback(false, "Nejprve zařaďte všechny položky.");
        let score = 0;
        items.forEach(item => { if(assigned[name(item)] === item.group) score++; });
        checked = true;
        redraw(true);
        scorePage(lesson, getLessonState(lesson.id).page, score);
        disableCheckButton();
        showFeedback(score === items.length, score === items.length ? (page.good || "Správně.") : (page.bad || `Správně ${score}/${items.length}. Špatně zařazené položky jsou označené červeně; šipka ukazuje správnou skupinu.`));
      };
      document.getElementById("nextBtn").onclick = nextPage;
    }

    function diagnosticSummaryHtml(lesson, st){
      if(!lesson.diagnostic) return "";
      const areas = lesson.diagnosticAreas || {};
      const stats = {};
      Object.values(st.answers || {}).forEach(pageAnswers => {
        if(Array.isArray(pageAnswers)) pageAnswers.forEach(a => {
          const tag = a.tag || "mixed";
          if(!stats[tag]) stats[tag] = { total:0, missed:0 };
          stats[tag].total += 1;
          if(!a.ok) stats[tag].missed += 1;
        });
      });
      const rows = Object.entries(stats).map(([tag,s]) => ({ tag, ...s, area: areas[tag] || { title:tag, repeat:"Zopakujte tuto oblast." } }));
      const weak = rows.filter(r => r.missed > 0).sort((a,b)=> b.missed - a.missed || b.total - a.total);
      const strong = rows.filter(r => r.missed === 0 && r.total > 0).map(r => r.area.title);
      const weakHtml = weak.length ? weak.slice(0,6).map(r => `<div class="summary-card"><h3>${esc(r.area.title)}</h3><p>Chyby: ${r.missed}/${r.total}. ${esc(r.area.repeat)}</p></div>`).join("") : `<div class="summary-card"><h3>Výborně</h3><p>Test nezachytil žádnou slabou oblast. Pro jistotu si můžete projít závěrečný mix.</p></div>`;
      const strongHtml = strong.length ? `<div class="summary-card"><h3>Dobře zvládáte</h3><p>${esc(strong.join(", "))}</p></div>` : "";
      return `<h3>Doporučení k opakování</h3>${weakHtml}${strongHtml}`;
    }

    function renderFinal(lesson, page){
      const st = getLessonState(lesson.id);
      const max = totalPoints(lesson);
      st.completed = true;
      st.page = lesson.pages.length - 1;
      st.best = Math.max(st.best || 0, st.score || 0);
      save();
      const percent = max ? Math.round((st.score / max) * 100) : 0;
      const deg = max ? Math.round((st.score / max) * 360) : 0;
      const next = nextLessonAfter(lesson.id);
      renderChrome("learn");
      screen.innerHTML = `<div class="mode-badge">Hotovo</div><h2>${esc(lesson.title)}</h2><div class="score-ring" style="--score-deg:${deg}deg"><div><div class="score-number">${percent}%</div><div class="small-note">${st.score}/${max} bodů</div></div></div>
        ${diagnosticSummaryHtml(lesson, st)}
        <div class="review-grid">${(lesson.prefixReview||[]).map(x=>`<div class="review-item"><strong>${esc(x.prefix)}</strong><span>${esc(x.meaning)}</span></div>`).join("")}</div>
        <div class="footer">
          ${next ? `<button class="primary" id="nextLessonBtn">Další lekce</button>` : ""}
          <button class="${next ? "secondary" : "primary"}" id="restartBtn">Začít lekci znovu</button>
          <button class="secondary" id="backHomeBtn">Zpět na seznam lekcí</button>
          <div class="small-note">Nejlepší výsledek této lekce: ${st.best}/${max} bodů</div>
        </div>`;
      if(next) document.getElementById("nextLessonBtn").onclick = () => startLesson(next.id);
      document.getElementById("restartBtn").onclick = () => restartLesson(lesson.id);
      document.getElementById("backHomeBtn").onclick = () => setView(partViewForLesson(lesson.id));
    }


    document.addEventListener("click", (event) => {
      if(event.target && event.target.id === "retryBtn"){
        const lesson = lessonById(app.lessonId);
        const st = getLessonState(lesson.id);
        delete st.pageScores[st.page];
        st.score = Object.values(st.pageScores).reduce((a,b)=>a + Number(b || 0), 0);
        save();
        render();
      }
    });

    backBtn.onclick = () => {
      if(app.view === "overview" || app.view === "greek" || app.view === "latin" || app.view === "test") return setView("home");
      if(app.view === "lesson") {
        const st = getLessonState(app.lessonId);
        if(st.page > 0) { st.page--; save(); render(); } else setView(partViewForLesson(app.lessonId));
      }
    };
    homeBtn.onclick = () => setView("home");
    render();

  </script>
</body>
</html>
